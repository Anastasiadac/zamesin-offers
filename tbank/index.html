<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Предложение для Т-Банка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
:root{--paper:#FFFFFF;--paper-2:#F4F4F1;--ink:#181B1E;--ink-2:#4A5057;--ink-3:#7A8087;--rule:#D5D7CF;--accent:#0E6B68;--accent-ink:#0B5654;--accent-soft:#DCEBE9;--warn:#8C5A23;--serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;font-size:17px}@media (min-width:64rem){html{font-size:18px}}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{max-width:76rem;margin:0 auto;padding:2.5rem 1.5rem 5rem}
.head{margin-bottom:2.5rem}
.head .row1{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.head .row1 .brand{color:var(--accent)}
.head h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1.15;margin:1rem 0 1.5rem;text-wrap:balance;letter-spacing:-.01em;max-width:20em}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.meta div{padding:.8rem 1rem .85rem 0;font-size:.9rem;line-height:1.4;min-width:0}
.meta div+div{border-left:1px solid var(--rule);padding-left:1rem}
.meta .k{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:.3rem}
.meta .v small{display:block;color:var(--ink-2);font-size:.85em}
.meta .v.price{font-family:var(--serif);font-size:1.25rem;font-weight:500;color:var(--accent-ink);font-variant-numeric:tabular-nums}
@media (max-width:40rem){.meta{grid-template-columns:1fr}.meta div+div{border-left:0;border-top:1px solid var(--rule);padding-left:0}}
.doc{display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem}
@media (min-width:64rem){.doc{grid-template-columns:12rem minmax(0,1fr)}}
.spine{font-size:.8125rem;line-height:1.45}
.spine nav{display:flex;flex-direction:column;gap:.1rem}
.spine nav a{display:block;color:var(--ink-3);text-decoration:none;padding:.3rem 0 .3rem .75rem;border-left:2px solid transparent;transition:color .15s,border-color .15s}
.spine nav a:hover,.spine nav a:focus-visible{color:var(--ink);outline:none}
.spine nav a.active{color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
@media (min-width:64rem){.spine{position:sticky;top:2rem;align-self:start}}
@media (max-width:63.9rem){.spine{display:none}}
main{min-width:0;max-width:44rem}
h2{font-family:var(--serif);font-weight:500;font-size:1.4rem;line-height:1.25;margin:2.75rem 0 .8rem;text-wrap:balance;scroll-margin-top:1.5rem}
main>h2:first-child{margin-top:0}
h3{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:1.5rem 0 .4rem}
p{margin:0 0 .9rem;max-width:38rem}
ul,ol{padding-left:1.2rem;margin:0 0 .9rem}li{margin:.25rem 0;max-width:37rem}
strong{font-weight:600}a{color:var(--accent-ink)}
.lead{font-size:1.05rem}
.note{border-left:3px solid var(--warn);background:var(--paper-2);padding:.8rem 1rem;margin:1rem 0 1.25rem;border-radius:0 4px 4px 0;font-size:.925rem;color:var(--ink-2)}.note p{margin:0}
.tablewrap{overflow-x:auto;margin:1rem 0 .5rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.875rem}
@media (max-width:40rem){table{min-width:36rem}}
th,td{text-align:left;vertical-align:top;padding:.6rem .8rem;border-bottom:1px solid var(--rule)}
th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--paper-2)}
tr:last-child td{border-bottom:0}td:first-child{font-weight:600}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{background:none;border:1px solid var(--rule);color:var(--accent-ink);font:inherit;font-size:.8125rem;font-weight:600;padding:.45rem .9rem;border-radius:3px;cursor:pointer;margin:0 0 1.25rem}
.toggle:hover,.toggle:focus-visible{border-color:var(--accent);outline:none;background:var(--accent-soft)}
.track{display:grid;gap:.75rem;margin:1rem 0 1.25rem}
.ws{border:1px solid var(--rule);border-radius:4px;padding:1rem 1.1rem;background:var(--paper-2)}
.ws .wk{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ws .wk span{color:var(--ink-3);font-weight:500;letter-spacing:.04em;text-transform:none}
.ws h3{margin:.25rem 0 .4rem}.ws ul{margin:0;font-size:.9rem;color:var(--ink-2)}.ws li{margin:.2rem 0}
.ws li.art{color:var(--ink);margin-top:.45rem}
.lectures{margin:.5rem 0 1.25rem}
.lectures h4{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:1rem 0 .35rem}
.lectures ul{font-size:.9rem;color:var(--ink-2)}.lectures li small{color:var(--ink-3)}
.options{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;margin:1rem 0}
@media (min-width:46rem){.options{grid-template-columns:1fr 1fr}}
.opt{border:1px solid var(--rule);border-radius:4px;padding:1.1rem 1.2rem;background:var(--paper-2);display:flex;flex-direction:column;gap:.35rem}
.opt.main{grid-column:1 / -1;border-color:var(--accent);background:var(--paper)}
.opt .k{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.opt .name{font-family:var(--serif);font-size:1.1rem;font-weight:600}
.opt .fee{font-family:var(--serif);font-size:1.9rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent-ink);margin:.2rem 0 0}
.opt .fee small{font-size:.5em;color:var(--ink-3);font-family:var(--sans);font-weight:500}
.opt .list{font-size:.875rem;color:var(--ink-2);margin:.35rem 0 0}.opt .list li{margin:.15rem 0}
.slots{display:flex;flex-wrap:wrap;gap:.6rem;margin:.75rem 0 1rem}
.slots a{display:inline-block;text-decoration:none;font-weight:600;font-size:.9rem;padding:.6rem 1rem;border-radius:3px;border:1px solid var(--accent);color:var(--accent-ink)}
.slots a.primary{background:var(--accent);color:var(--paper)}
.slots a:hover,.slots a:focus-visible{outline:none;filter:brightness(1.08)}
.sig{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--rule);color:var(--ink-2);font-size:.9rem}.sig strong{color:var(--ink)}
.small{font-size:.8125rem;color:var(--ink-3)}


.skills{display:grid;gap:.4rem;margin:1rem 0 1.25rem;padding:0;list-style:none}
.skills details{border:1px solid var(--rule);border-radius:4px;background:var(--paper-2);padding:0}
.skills details[open]{background:var(--paper)}
.skills summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;font-family:var(--serif);font-size:1.02rem;font-weight:600}
.skills summary::-webkit-details-marker{display:none}
.skills summary::before{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:.1rem}
.skills details[open] summary::before{transform:rotate(45deg)}
.skills summary:hover,.skills summary:focus-visible{color:var(--accent-ink);outline:none}
.skills details p{margin:0;padding:0 .9rem .8rem 2.1rem;color:var(--ink-2);font-size:.925rem;max-width:none}

.gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.gate form{width:100%;max-width:26rem;border:1px solid var(--rule);border-radius:4px;padding:1.6rem 1.6rem 1.4rem;background:var(--paper-2)}
.gate .brand{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.gate h1{font-family:var(--serif);font-weight:500;font-size:1.45rem;line-height:1.2;margin:.6rem 0 .3rem;text-wrap:balance}
.gate p{color:var(--ink-2);font-size:.9rem;margin:0 0 1rem}
.gate label{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:.35rem}
.gate .row{display:flex;gap:.5rem}
.gate input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:.6rem .75rem;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink)}
.gate input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.gate button{font:inherit;font-size:.9rem;font-weight:600;padding:.6rem 1rem;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer;white-space:nowrap}
.gate button:hover,.gate button:focus-visible{filter:brightness(1.08);outline:none}
.gate .err{color:#9B2C2C;font-size:.85rem;margin:.6rem 0 0;min-height:1.2em}
</style>
</head>
<body>
<div class="gate" id="gate"><form id="gateForm" autocomplete="off">
<div class="brand">Школа Вани Замесина</div>
<h1>Предложение для Т-Банка</h1>
<p>Страница закрыта паролем. Введите пароль из письма.</p>
<label for="pw">Пароль</label>
<div class="row"><input id="pw" type="password" inputmode="text" autocapitalize="off" spellcheck="false" required><button type="submit">Открыть</button></div>
<div class="err" id="err" aria-live="polite"></div>
</form></div>
<div id="app" hidden></div>

    }catch(e){return false;}
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();err.textContent='';
    var btn=form.querySelector('button');btn.disabled=true;btn.textContent='Открываем…';
    var ok=await open(pw.value.trim());
    btn.disabled=false;btn.textContent='Открыть';
    if(!ok){err.textContent='Неверный пароль';pw.select();}
  });
  try{var s=sessionStorage.getItem('tbank-offer-pw');if(s){open(s);}}catch(e){}
  function initPage(){
  var tb=document.getElementById('toggleLectures'),bx=document.getElementById('lectures');
  if(tb&&bx){tb.addEventListener('click',function(){var open=bx.hidden;bx.hidden=!open;tb.setAttribute('aria-expanded',open?'true':'false');tb.textContent=open?'Скрыть лекции':'Показать лекции между воркшопами';});}
  var links=Array.prototype.slice.call(document.querySelectorAll('.spine nav a'));
  var current=null;
  function heads(){return links.map(function(a){return document.querySelector(a.getAttribute('href'));}).filter(Boolean);}
  function update(){var hs=heads();if(!hs.length)return;var top=window.scrollY+120,best=hs[0];hs.forEach(function(h){if(h.getBoundingClientRect().top+window.scrollY<=top)best=h;});
    if(best.id!==current){current=best.id;links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+current);});}}
  window.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);update();
  }
})();
</script>
</body>
</html>
